name: "安装与使用求助 / Setup & usage"
description: "安装卡住、Skill 未识别、运行报错或页面打不开。Ask for help even if you are not sure it is a bug."
title: "[Help] "
body:
  - type: markdown
    attributes:
      value: |
        中文或英文都可以。不确定是不是 bug，也欢迎从现象开始描述。
        English or Chinese is welcome. You do not need to diagnose the cause.
        不需要上传完整材料；截图或日志请去掉私人内容。A small, sanitized example is optional.
  - type: dropdown
    id: client
    attributes:
      label: "使用的客户端 / Client"
      options:
        - WorkBuddy
        - Codex
        - Claude Code
        - GitHub Copilot CLI
        - "其他 / Other"
        - "不确定 / Not sure"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "想完成什么，卡在哪一步？ / Goal and obstacle"
      placeholder: "例如：安装后请求处理 PDF，但客户端没有识别 Skill。 / Example: I installed the skill, but the client does not recognize it."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "系统与版本（选填） / OS and versions (optional)"
      description: "写你知道的即可，例如 Windows 11、v1.0 ZIP、Python 3.11；不清楚可以留空。Include only what you know."
  - type: textarea
    id: steps
    attributes:
      label: "操作步骤、报错或截图（选填） / Steps, error or screenshot (optional)"
      description: "可以粘贴操作步骤和脱敏后的报错，或拖入截图。You may paste steps or sanitized errors, or attach a screenshot."
